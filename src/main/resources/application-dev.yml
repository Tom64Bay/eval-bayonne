spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library}
    username: ${DB_USER:library}
    password: ${DB_PASSWORD:library}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev-data

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.evalbayonne.library: DEBUG
    org.hibernate.SQL: DEBUG
